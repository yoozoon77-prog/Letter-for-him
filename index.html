<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>to. 오빠</title>

<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo&display=swap" rel="stylesheet">

<style>

body{

  margin:0;

  background:#f7efe5;

  font-family:'Nanum Myeongjo', serif;

  overflow:hidden;

}

/* 인트로 */

.intro{

  position:absolute;

  width:100%;

  height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  background:#f2e4d7;

  flex-direction:column;

}

.intro h1{

  font-size:22px;

  opacity:0;

  animation:fadeIn 2s forwards;

}

.intro button{

  margin-top:20px;

  padding:10px 20px;

  border:none;

  background:#d6bfa9;

  color:#fff;

  border-radius:20px;

  cursor:pointer;

}

/* 편지 */

.letter{

  display:none;

  width:100%;

  height:100vh;

  justify-content:center;

  align-items:center;

  background:#f7efe5;

}

.paper{

  width:320px;

  padding:25px;

  background:#fffdf9;

  box-shadow:0 0 20px rgba(0,0,0,0.1);

  border-radius:10px;

  line-height:1.8;

  position:relative;

}

/* 커피 얼룩 느낌 */

.paper::before{

  content:'';

  position:absolute;

  width:120px;

  height:120px;

  background:radial-gradient(rgba(150,100,50,0.2), transparent);

  top:-30px;

  right:-30px;

  border-radius:50%;

}

/* 약속 파트 */

.promise{

  margin-top:20px;

  padding-top:15px;

  border-top:1px solid #ddd;

  font-size:14px;

  color:#555;

}

@keyframes fadeIn{

  to{opacity:1;}

}

</style>

</head>

<body>

<div class="intro" id="intro">

  <h1>오빠한테 전하고 싶은 말이 있어</h1>

  <button onclick="showLetter()">열어보기</button>

</div>

<div class="letter" id="letter">

  <div class="paper">

    <p>

    오빠한테 진짜 미안하다는 말 먼저 하고 싶어.<br><br>

    내가 그때 했던 말이 얼마나 상처될 수 있는지  

    제대로 생각 못하고 말해버린 것 같아.<br><br>

    오빠가 얼마나 힘들게 얘기 꺼냈을지도 이제야 생각나고  

    그걸 내가 가볍게 꺼내버린 게 너무 미안해.

    </p>

    <div class="promise">

      앞으로는 감정 올라와도 함부로 말하지 않을게.<br>

      오빠 상황 먼저 생각하는 사람이 될게.

    </div>

  </div>

</div>

<script>

function showLetter(){

  document.getElementById('intro').style.display='none';

  document.getElementById('letter').style.display='flex';

}

</script>

</body>

</html>
